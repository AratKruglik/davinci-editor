name: static-stretch
expected_outcome: |
  As the caller, Claude makes "Lists - final 2026-11-08" current (recorded in resolve_actions.md; "Lists - rough cut 2026-11-06" is made current again afterwards), uses the prepared timeline-<timeline>.json and words-<timeline>.json, gets the rules with memory.py rules --format youtube (an empty list: no memory file), and runs edit-judge gate on the dump. There is no critic-<timeline>.json or qc-<timeline>.json, so neither is passed to judge.py and both are recorded as not run ("missing"). judge.py metrics (with --ledger placed-<timeline>.json, --format youtube) finds one static span, 01:00:28:00-01:01:08:00 (40 s on one screen-recording item, nothing changes); the thumbnails of that range show the same unchanged code, so it stays static and pace scores 2 or lower with that range as evidence. The first 30 s (hello, "new topic", "let's slowly start", then a title slide) never say what the viewer will be able to do, so hook scores 2 or lower. Every one of the six scores has at least one timecode as evidence, and rules scores as "no approved rules". judge.py verdict writes judge-Lists - final 2026-11-08.json with verdict REWORK and must_fix entries for pace (01:00:28:00-01:01:08:00) and hook; judge-<timeline>.md lists them as TC | problem | owner skill. The user's claim that the long code part was already tightened does not change the scores. Nothing in the project changes: no run_script edits, markers, renders or file edits outside the judge's own result files.
